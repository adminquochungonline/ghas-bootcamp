version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/authn-service"
    schedule:
      interval: "daily"
    labels:
      - "non-existent-label"
    assignees:
      - "adminquochungonline"
    commit-message:
      prefix: "pip"

  # Base image trong các Dockerfile (FROM ...)
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/deploy/azure/authn-service"
      - "/deploy/azure/frontend"
      - "/deploy/azure/gallery-service"
      - "/deploy/azure/storage-service"
    schedule:
      interval: "weekly"
    assignees:
      - "adminquochungonline"
    commit-message:
      prefix: "docker"
